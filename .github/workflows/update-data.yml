name: Update EFOA tournament data
on:
  schedule:
    - cron: '15 6,15 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/scrape.py
      - name: Commit changed data
        run: |
          git config user.name "efoa-tournament-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tournaments.json data/efoa-tournaments.ics
          git diff --cached --quiet || git commit -m "Update EFOA tournament data"
          git push
