name: Update EFOA tournament data
on:
  schedule:
    - cron: '15 6,15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scraper/**'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

concurrency:
  group: efoa-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Sync latest main
        run: git pull --rebase origin main
      - run: python scraper/scrape.py
      - name: Commit changed data
        run: |
          git config user.name "efoa-tournament-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tournaments.json data/efoa-tournaments.ics data/geocode-cache.json
          git diff --cached --quiet && exit 0
          git commit -m "Update EFOA tournament data"
          git pull --rebase origin main
          git push origin main
