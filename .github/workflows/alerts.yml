name: Favorite tournament alerts

on:
  schedule:
    - cron: '7 * * * *'
  workflow_run:
    workflows: ["Update EFOA tournament data"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/alerts.json'
      - 'scraper/check_alerts.py'
      - 'scraper/publish_alerts.py'
      - '.github/workflows/alerts.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: efoa-alerts
  cancel-in-progress: false

jobs:
  alerts:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Detect alerts
        run: python scraper/check_alerts.py
      - name: Publish GitHub notifications
        run: python scraper/publish_alerts.py
      - name: Save alert state
        run: |
          rm -f data/pending-alerts.json data/alert-state-next.json
          git config user.name "efoa-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/alert-state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update tournament alert state"
          git pull --rebase origin main
          git push origin main
